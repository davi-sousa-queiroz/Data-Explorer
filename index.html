<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <ul>
        <div class="logo">Data Explorer</div>
        <ul class="links">
          <li class="countries" class="link">Countries</li>
          <li class="animals" class="link">Animals</li>
          <li class="space" class="link">Space and planets</li>
          <li class="games" class="link">Game items</li>
          <li class="programming" class="link">Programming languages</li>
        </ul>
      </ul>
    </nav>
    <main class="data-area">
      <section class="data-container" aria-label="Data display">
        <h1 class="heading">Explore a Dataset.</h1>
        <p class="tutorial">select a data topic from the navagation bar.</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
